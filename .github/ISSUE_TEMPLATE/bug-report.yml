name: Bug report
description: Something behaves differently from what arrow-player.md specifies.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **There are no releases yet.** This repository is pre-1.0 and nothing has
        been published, so a report here is about the tree you built, not about a
        version you downloaded. The fields below ask for the commit for that
        reason — see [ROADMAP.md](https://github.com/maragung/ArrowPlayer/blob/main/docs/ROADMAP.md) for what is
        expected to work at all.

        If this is a security vulnerability, close this form and use the private
        route in [SECURITY.md](https://github.com/maragung/ArrowPlayer/blob/main/SECURITY.md).

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
      placeholder: adfee82
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: >-
        §3.1 names these as the supported targets. Anything else is useful to
        know but is not a target yet.
      options:
        - Ubuntu 24.04 LTS
        - Ubuntu 22.04 LTS
        - Another Debian-based distribution
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: input
    id: preset
    attributes:
      label: CMake preset
      description: >-
        Which preset built it. Sanitiser presets catch things release builds hide,
        and the reverse, so this changes what the report means.
      placeholder: linux-release
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the specification says should happen
      description: >-
        Quote the requirement ID if you can find it (`REQ-<AREA>-<NNN>`). A report
        that names the requirement is a report somebody can act on without first
        deciding whether it is a bug at all.
      placeholder: |
        REQ-AUD-040 says the gap between two tracks of the same format must be
        sample-exact.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact error text, and the failing test name if a test caught it.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The smallest sequence that shows it. If a file triggers it, say what kind
        of file and where it came from — **do not attach copyrighted audio**; a
        few seconds re-encoded from a known-good source, or the output of
        `tools/make-seeds.py`, is enough.
      placeholder: |
        1. cmake --preset linux-release && ctest --preset linux-release
        2. …
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Gate output, if a gate is involved
      description: >-
        Paste the tail of the failing gate. CONTRIBUTING.md has the sequence, and
        every gate has a `--self-test` — running it first tells you whether the
        checker or the repository is broken.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: >-
            I have not pasted anything private. There is no telemetry to attach
            (§2.1 — no accounts, no ads, no telemetry), so nothing here was
            collected automatically: everything in this report is something I
            chose to include.
          required: true
