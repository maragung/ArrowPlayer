# ---------------------------------------------------------------------------
#  android-ci.yml — spec §25.1 (REQ-BLD-020), Phase 0 exit gate 2.
#
#  ADR 0012 restored the Android target that ADR 0011 had deferred, so this
#  workflow exists for the first time. What it proves today is what the
#  scaffold has: the Gradle build is reproducible, the linters the spec names
#  (ktlint, detekt) run, the debug APK assembles and its unit tests pass, and
#  the APK installs and launches on an emulator. The instrumented suites, the
#  macrobenchmarks and the conformance-fixture agreement (REQ-GEN-031) arrive
#  with the phases that own their code — nothing here claims them.
#
#  On a version tag it builds the release APKs and uploads them to the same
#  GitHub Release release.yml creates. The create/upload pair is idempotent
#  (`|| true` on create, `--clobber` on upload) because the two workflows run
#  concurrently and either may reach the release first.
# ---------------------------------------------------------------------------
name: android-ci

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared-spec/**', '.github/workflows/android-ci.yml']
    tags: ['v*.*.*']
  pull_request:
    paths: ['android/**', 'shared-spec/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assemble + lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # §25.1: "restore Gradle cache". setup-gradle caches ~/.gradle keyed on
      # the lockfiles; the version is pinned to the same 8.9 the committed
      # wrapper properties name, so local and CI cannot diverge.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.9'

      # Phase 0 exit gate 4 names ktlint. detekt is §25.1's own list. Both run
      # before assemble so a style regression fails in seconds.
      - name: ktlint (exit gate 4)
        run: gradle ktlintCheck --no-daemon
        working-directory: android

      - name: detekt
        run: gradle detekt --no-daemon
        working-directory: android

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # -------------------------------------------------------------------------
  #  Phase 0 exit gate 2's "installs on an emulator" half. Not on pull
  #  requests: an emulator boot on every review would make the feedback loop
  #  the lint job exists to keep short. continue-on-error is the OQ-044 shape
  #  and the condition for removing it is the same — the first green run on
  #  this job, recorded in OQ-018. A red emulator must not be read as a red
  #  scaffold; it is evidence about the runner, not about the APK.
  # -------------------------------------------------------------------------
  emulator:
    name: install on emulator (exit gate 2)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android

      # No working-directory here: a step that runs an action (`uses`) cannot
      # carry one, which the first push of this file proved at parse time. The
      # script paths are therefore absolute from the workspace root.
      - name: Boot an emulator and install + launch the APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n io.github.arrowplayer.app/.MainActivity
            sleep 8
            # The process must be alive after launch — "installs and launches"
            # is what gate 2 asks, and pidof answering is the launch evidence.
            adb shell pidof io.github.arrowplayer.app

  # -------------------------------------------------------------------------
  #  §25.1: "On a version tag: build … per-ABI APKs … and upload to the
  #  release." Unsigned until a signing identity exists (REQ-SEC-016, Phase 9);
  #  the release notes name that, so an unsigned artifact is a stated fact
  #  rather than a surprise. Naming follows REQ-BLD-026.
  # -------------------------------------------------------------------------
  release:
    name: per-ABI release APKs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.9'

      - name: Build release APKs (all ABIs)
        # --rerun-tasks: the gradle-actions cache can hold an old compile
        # output that no longer matches the source on main; rerunning
        # tasks forces a fresh Kotlin compile so the MainActivity the
        # current build adds actually lands in classes.dex.
        # --no-build-cache: prevents the cache from serving a debug build
        # in place of the release one. gradle/actions/setup-gradle caches
        # the per-task output; the key for `compileReleaseKotlin` includes
        # the variant, so debug outputs cannot replace release ones, but
        # the mergeReleaseJniLibFolders task has reused an earlier debug
        # artifact set in the past — disabling the build cache here
        # forces every step to re-execute against the current tree.
        run: gradle assembleRelease --no-daemon --rerun-tasks --no-build-cache
        working-directory: android

      - name: Name the APKs per REQ-BLD-026 and upload to the release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # release.yml's publish job creates the release; either workflow may
          # get there first, so create is idempotent and upload clobbers.
          gh release create "$TAG" --title "$TAG" --notes "Arrow Player $TAG — see the desktop artifacts in this release too." >/dev/null 2>&1 || true
          version="${VERSION#v}"
          out_dir="$RUNNER_TEMP/apks"
          mkdir -p "$out_dir"
          # Debug: what is actually there?
          find android/app/build/outputs -name "*.apk" 2>/dev/null | sort || true
          ls -la android/app/build/outputs/apk/ 2>/dev/null || true
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true
          shopt -s nullglob
          # AGP names per-ABI release APKs as app-<abi>-release-unsigned.apk
          # when the build is unsigned. Bash glob `*` does not match the
          # `-` separator inside the ABI name, so the pattern needs a
          # second `*` to span "release" and the optional "-unsigned"
          # suffix. The regex below allows the underscore in `x86_64`
          # to land in the ABI capture group. The destination filename
          # keeps the spec name.
          for apk in android/app/build/outputs/apk/release/app-*-release*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-([a-z0-9_-]+)-release(-unsigned)?\.apk$/\1/')
            dest="$out_dir/arrow-player-$version-android-$abi.apk"
            cp "$apk" "$dest"
            sha256sum "$dest" > "$dest.sha256"
          done
          ls -la "$out_dir"
          if compgen -G "$out_dir/arrow-player-*.apk" > /dev/null; then
            gh release upload "$TAG" "$out_dir"/arrow-player-*.apk "$out_dir"/arrow-player-*.sha256 --clobber
          else
            echo "::error::No APKs were produced. Check the build output above; the abi split in app/build.gradle.kts must be generating per-ABI artifacts."
            exit 1
          fi
          echo "::notice::Release APKs are unsigned. REQ-SEC-016 needs a signing"
          echo "::notice::identity, which is Phase 9 work; see docs/OPEN-QUESTIONS.md."
