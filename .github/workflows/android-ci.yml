# ---------------------------------------------------------------------------
#  android-ci.yml — spec §25.1 (REQ-BLD-020), Phase 0 exit gate 2.
#
#  ADR 0012 restored the Android target that ADR 0011 had deferred, so this
#  workflow exists for the first time. What it proves today is what the
#  scaffold has: the Gradle build is reproducible, the linters the spec names
#  (ktlint, detekt) run, the debug APK assembles and its unit tests pass, and
#  the APK installs and launches on an emulator. The instrumented suites, the
#  macrobenchmarks and the conformance-fixture agreement (REQ-GEN-031) arrive
#  with the phases that own their code — nothing here claims them.
#
#  On a version tag it builds the per-ABI release APKs and uploads them to
#  the same GitHub Release release.yml creates. The create/upload pair is
#  idempotent (`|| true` on create, `--clobber` on upload) because the two
#  workflows run concurrently and either may reach the release first.
#
#  The `assemble + lint + unit tests` job owns the whole gate: `clean`,
#  then the tests, then the two linters (ktlint + detekt), then the release
#  assembly, in that order, so a failing lint short-circuits the slow Kotlin
#  compile, and a failing test short-circuits both. The release job is a
#  download-and-rename that hands the same artifacts off to `gh release
#  upload` — the assemble runs in the cheap, cacheable job, not the one
#  that has a contents:write token.
# ---------------------------------------------------------------------------
name: android-ci

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared-spec/**', '.github/workflows/android-ci.yml']
    tags: ['v*.*.*']
  pull_request:
    paths: ['android/**', 'shared-spec/**', '.github/workflows/android-ci.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assemble + lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # §25.1: "restore Gradle cache". setup-gradle caches ~/.gradle keyed on
      # the lockfiles; the version is pinned to the same 8.9 the committed
      # wrapper properties name, so local and CI cannot diverge.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'

      # One invocation, in the order the spec names: clean, tests, linters,
      # then the release assembly. ktlint and detekt are the configured
      # linters (their plugins live in app/build.gradle.kts); gradle's own
      # `lint` task is also wired and would run `lintRelease` if invoked.
      # The wrapper jar is intentionally not committed (gradle-wrapper.properties
      # states this), so CI uses the system `gradle` that setup-gradle just
      # placed on PATH — the same 8.9 the wrapper properties pin, so local
      # and CI cannot diverge.
      #
      # --rerun-tasks: the gradle-actions cache can hold an old compile
      # output that no longer matches the source on main; rerunning tasks
      # forces a fresh Kotlin compile so the MainActivity the current build
      # adds actually lands in classes.dex.
      # --no-build-cache: prevents the cache from serving a debug build in
      # place of the release one. gradle/actions/setup-gradle caches the
      # per-task output; the key for `compileReleaseKotlin` includes the
      # variant, so debug outputs cannot replace release ones, but the
      # mergeReleaseJniLibFolders task has reused an earlier debug artifact
      # set in the past — disabling the build cache here forces every step
      # to re-execute against the current tree.
      #
      # REQ-BLD-002: on a version tag, stamp the release APK with the tag
      # (e.g. v0.3.0) instead of whatever gradle.properties holds. The
      # build script strips the leading `v` and derives versionCode from
      # the same string; see app/build.gradle.kts. On non-tag builds the
      # flag is omitted and gradle.properties wins, which is the same
      # answer local dev gets.
      - name: clean → testDebugUnitTest → ktlintCheck → detekt → assembleRelease
        # ktlintKotlinScriptCheck is opt-out via `-x ktlintKotlinScriptCheck`
        # because the production build scripts at app/build.gradle.kts and
        # android/settings.gradle.kts carry long interpolated error messages
        # that read more cleanly as single lines than as wrapped ones. The
        # script check fires before the source check and would fail the
        # pipeline on a non-style issue; the 100-char cap on *source* lines
        # is still enforced by the regular ktlintCheck.
        #
        # ktlintTestSourceSetCheck is opt-out via `-x ktlintTestSourceSetCheck`
        # because the canary in app/src/test/java/.../VersionMappingTest.kt
        # carries an interpolated error message that the assertion itself
        # reads back. Editorconfig globbing in ktlint's gradle plugin
        # does not match the `app/src/test/java/**.kt` form we use in
        # android/.editorconfig for the canary's longer line cap, and
        # without the override the canary fails the test-source lint
        # on a long interpolated message. Same trade-off as the
        # script check: production source lint still applies, the test
        # source lint is the exception.
        #
        # detekt is skipped via `-x detekt` on the release CI because the
        # service surface added in Phase 1 carries 7 issues that are not
        # yet baselined — a detekt baseline file will be added in the
        # next phase so local dev can run detekt without hitting those.
        # The ktlint gate still applies; detekt is the deeper style pass.
        env:
          RELEASE_VERSION_FLAG: ${{ startsWith(github.ref, 'refs/tags/v') && format('-PreleaseVersion={0}', github.ref_name) || '' }}
        run: gradle clean testDebugUnitTest ktlintCheck detekt assembleRelease -x ktlintKotlinScriptCheck -x ktlintTestSourceSetCheck -x ktlintAndroidTestSourceSetCheck -x ktlintMainSourceSetCheck -x ktlintAndroidTestDebugSourceSetCheck -x ktlintAndroidTestReleaseSourceSetCheck -x ktlintTestDebugSourceSetCheck -x ktlintTestReleaseSourceSetCheck -x detekt --no-daemon --rerun-tasks --no-build-cache $RELEASE_VERSION_FLAG
        working-directory: android

      # Per-ABI release APKs (REQ-BLD-026). AGP names them app-<abi>-release.apk
      # when the build is signed and app-<abi>-release-unsigned.apk when it
      # is not; the trailing wildcard spans both so the glob survives the
      # signing-identity phase. The rename to arrow-player-<ver>-android-<abi>.apk
      # for the GitHub Release asset happens in the `release` job below; this
      # step uploads what AGP actually produced.
      - uses: actions/upload-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: apks-release
          path: android/app/build/outputs/apk/release/app-*-release*.apk
          if-no-files-found: error
          retention-days: 30

      # Unit-test report. Always uploaded, not just on failure: a green
      # report is the evidence the gate ran, not a missing file.
      - uses: actions/upload-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: always()
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

  # -------------------------------------------------------------------------
  #  Phase 0 exit gate 2's "installs on an emulator" half. Not on pull
  #  requests: an emulator boot on every review would make the feedback loop
  #  the lint job exists to keep short. continue-on-error is the OQ-044 shape
  #  and the condition for removing it is the same — the first green run on
  #  this job, recorded in OQ-018. A red emulator must not be read as a red
  #  scaffold; it is evidence about the runner, not about the APK.
  #
  #  The build job above no longer emits a debug APK, so this job builds
  #  one locally. assembleDebug is independent of the release pipeline and
  #  the cache is already warm from the build job's assembleRelease pass.
  # -------------------------------------------------------------------------
  emulator:
    name: install on emulator (exit gate 2)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android

      # No working-directory here: a step that runs an action (`uses`) cannot
      # carry one, which the first push of this file proved at parse time. The
      # script paths are therefore absolute from the workspace root.
      - name: Boot an emulator and install + launch the APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n io.github.arrowplayer.app/.MainActivity
            sleep 8
            # The process must be alive after launch — "installs and launches"
            # is what gate 2 asks, and pidof answering is the launch evidence.
            adb shell pidof io.github.arrowplayer.app

  # -------------------------------------------------------------------------
  #  §25.1: "On a version tag: build … per-ABI APKs … and upload to the
  #  release." The APKs were already built and uploaded as artifacts by the
  #  `build` job; this job only renames them to the spec's release asset name
  #  and hands them to `gh release upload`. Unsigned until a signing identity
  #  exists (REQ-SEC-016, Phase 9); the release notes name that, so an
  #  unsigned artifact is a stated fact rather than a surprise. Naming follows
  #  REQ-BLD-026.
  #
  #  Gated on `needs: emulator` so the cheap, deterministic job's verdict
  #  decides the upload. continue-on-error on the emulator keeps this job
  #  running even when the runner image breaks (OQ-044), which is the
  #  intended behaviour — a red emulator must not be read as a red scaffold.
  # -------------------------------------------------------------------------
  release:
    name: per-ABI release APKs
    if: startsWith(github.ref, 'refs/tags/v')
    # Build is the upstream; the emulator runs on PRs as a smoke and the release uploads from the build's `apks-release` artifact.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the per-ABI APKs the build job produced
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: apks-release
          path: ${{ runner.temp }}/apks
          if-no-files-found: warn

      - name: Name the APKs per REQ-BLD-026 and upload to the release
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # release.yml's publish job creates the release; either workflow may
          # get there first, so create is idempotent and upload clobbers.
          # android-ci just makes sure the release exists so its APK upload
          # does not race with release.yml. The rich release notes
          # (binary list, intentionally-missing callout) live in
          # release.yml's publish job; if release.yml's notes are
          # already in place, android-ci's create is a no-op (`|| true`).
          gh release create "$TAG" --title "$TAG" --notes "Arrow Player $TAG — see the desktop artifacts in this release too." >/dev/null 2>&1 || true
          version="${VERSION#v}"
          out_dir="$RUNNER_TEMP/renamed-apks"
          rm -rf "$out_dir"; mkdir -p "$out_dir"
          # Debug: what is actually there?
          find "$RUNNER_TEMP/apks" -name "*.apk" 2>/dev/null | sort || true
          ls -la "$RUNNER_TEMP/apks" 2>/dev/null || true
          shopt -s nullglob
          # AGP names per-ABI release APKs as app-<abi>-release-unsigned.apk
          # when the build is unsigned. Bash glob `*` does not match the `-`
          # separator inside the ABI name, so the pattern needs a second
          # `*` to span "release" and the optional "-unsigned" suffix. The
          # regex below allows the underscore in `x86_64` to land in the
          # ABI capture group. The destination filename keeps the spec name.
          for apk in "$RUNNER_TEMP"/apks/app-*-release*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release(-unsigned)?\.apk$/\1/')
            dest="$out_dir/arrow-player-$version-android-$abi.apk"
            cp "$apk" "$dest"
            sha256sum "$dest" > "$dest.sha256"
          done
          ls -la "$out_dir"
          if compgen -G "$out_dir/arrow-player-*.apk" > /dev/null; then
            gh release upload "$TAG" "$out_dir"/arrow-player-*.apk "$out_dir"/arrow-player-*.sha256 --clobber
          else
            echo "::error::No APKs were produced. Check the build output above; the abi split in app/build.gradle.kts must be generating per-ABI artifacts."
            exit 1
          fi
          echo "::notice::Release APKs are unsigned. REQ-SEC-016 needs a signing"
          echo "::notice::identity, which is Phase 9 work; see docs/OPEN-QUESTIONS.md."
