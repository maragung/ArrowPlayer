name: desktop-ci

# Spec §25.2 (REQ-BLD-021). Matrix per §3.1: Windows and both Ubuntu LTS targets.
#
# Note on dependencies: the build is designed so that every external library is
# optional at configure time (see cmake/EclipseDependencies.cmake). The domain
# layer — which is where the audio maths, parsers and validators live — compiles
# and tests with nothing but a C++20 compiler. Adapters are built only where
# their library is present. That keeps this workflow fast and keeps a missing
# system package from turning into a red build for unrelated reasons.

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION_FILE: desktop/qt-version.txt

jobs:
  # -------------------------------------------------------------------------
  #  Architecture gates — cheap, and they fail fast before any compilation.
  # -------------------------------------------------------------------------
  gates:
    name: architecture gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Layer dependency rules (REQ-GEN-051)
        run: python3 tools/check-layers.py

      - name: SQL safety — no string-built queries (REQ-SEC-009)
        run: python3 tools/check-sql-safety.py

      - name: Real-time safety annotations (REQ-AUD-017)
        run: python3 tools/check-rt-safety.py

  # -------------------------------------------------------------------------
  #  Build and test
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ubuntu-22.04 · gcc-12',  os: ubuntu-22.04, preset: linux-release, cc: gcc-12,  cxx: g++-12 }
          - { name: 'ubuntu-24.04 · gcc-13',  os: ubuntu-24.04, preset: linux-release, cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · asan',    os: ubuntu-24.04, preset: linux-asan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · tsan',    os: ubuntu-24.04, preset: linux-tsan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · clang',   os: ubuntu-24.04, preset: linux-release, cc: clang-18, cxx: clang++-18 }
          - { name: 'windows-2022 · msvc',    os: windows-2022, preset: windows-release }

    steps:
      - uses: actions/checkout@v4

      # §3.2: Ubuntu 22.04 defaults to GCC 11, whose C++20 support is incomplete.
      # The spec requires GCC 12+, so it must be installed and selected explicitly.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cxx }} \
            libsqlite3-dev zlib1g-dev pkg-config
          # Optional adapter dependencies. Failure here must not fail the build:
          # the adapters are dependency-gated by design.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libtag1-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libsamplerate0-dev || echo "some optional adapters unavailable"

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
        working-directory: desktop

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: desktop

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
        working-directory: desktop

      # REQ-GEN-015: mechanically assert the FFmpeg this build links is neither
      # GPL nor nonfree. A blocking licence gate, not a review item — §4.4.
      #
      # The build directory is asked for, never guessed. CMakePresets sets
      # binaryDir to ${sourceDir}/../build/${presetName}, which is the repository
      # root, not desktop/build — and the first version of this step tested
      # `build/<preset>/tests/test_decode` with working-directory: desktop, a path
      # that cannot exist. It took the "not applicable" branch on every run from
      # the day it was written: a licence gate that had never once executed.
      # `ctest --preset` already knows where the binaries are, so it is asked.
      #
      # The three states are kept distinct on purpose. A skip is only honest while
      # nothing in the tree links FFmpeg; once the adapter is here, an unregistered
      # licence case is a failure, because that is the exact shape of the bug this
      # step used to have.
      - name: FFmpeg licence assertion (REQ-GEN-015)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -uo pipefail
          # `ctest -N` exits non-zero when nothing matches, which is information
          # here rather than an error, hence the `|| true`.
          listing=$(ctest --preset ${{ matrix.preset }} -N -R '^FfmpegLicense\.' 2>&1 || true)
          registered=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p')
          registered=${registered:-0}

          if [ "$registered" -gt 0 ]; then
            echo "$registered FfmpegLicense case(s) registered; asserting REQ-GEN-015."
            exec ctest --preset ${{ matrix.preset }} -R '^FfmpegLicense\.' --output-on-failure
          fi

          if [ -e src/audio/decode/ffmpeg_decoder.cpp ]; then
            echo "::error::An FFmpeg adapter exists (src/audio/decode/ffmpeg_decoder.cpp)" \
                 "but no FfmpegLicense.* case is registered, so REQ-GEN-015 is unenforced." \
                 "Add the assertion test; do not relax this step."
            exit 1
          fi

          if pkg-config --exists libavformat libavcodec libavutil libswresample; then
            echo "::notice::FFmpeg is present on this runner, but no adapter in the tree" \
                 "links it yet, so REQ-GEN-015 has nothing to assert (arrives in Phase 1)."
          else
            echo "::notice::FFmpeg development packages are unavailable on this runner;" \
                 "no FFmpeg is linked and REQ-GEN-015 has nothing to assert."
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          # Repository-root build/, per CMakePresets' binaryDir — the same
          # path mistake that disabled the licence gate above once made this
          # upload silently empty.
          path: build/${{ matrix.preset }}/Testing/
          retention-days: 7

  # -------------------------------------------------------------------------
  #  Static analysis
  # -------------------------------------------------------------------------
  analyse:
    name: static analysis
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
            cppcheck libsqlite3-dev zlib1g-dev pkg-config

      - name: clang-format (REQ-BLD-004)
        run: |
          find desktop/src desktop/tests desktop/include -type f \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

      - name: Configure for compile database
        run: cmake --preset linux-debug
        working-directory: desktop

      - name: clang-tidy (REQ-SEC-015)
        run: |
          find src tests -name '*.cpp' -print0 \
            | xargs -0 -P 4 -n 1 clang-tidy-18 \
                -p "../build/linux-debug" --warnings-as-errors='*'
        working-directory: desktop

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr --error-exitcode=1 --quiet \
                   --std=c++20 --suppress=missingIncludeSystem \
                   -I src -I include src/
        working-directory: desktop
