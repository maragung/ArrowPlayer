name: desktop-ci

# Spec §25.2 (REQ-BLD-021). Matrix per §3.1: Windows and both Ubuntu LTS targets.
#
# Note on dependencies: the build is designed so that every external library is
# optional at configure time (see cmake/EclipseDependencies.cmake). The domain
# layer — which is where the audio maths, parsers and validators live — compiles
# and tests with nothing but a C++20 compiler. Adapters are built only where
# their library is present. That keeps this workflow fast and keeps a missing
# system package from turning into a red build for unrelated reasons.

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION_FILE: desktop/qt-version.txt

jobs:
  # -------------------------------------------------------------------------
  #  Architecture gates — cheap, and they fail fast before any compilation.
  # -------------------------------------------------------------------------
  gates:
    name: architecture gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Layer dependency rules (REQ-GEN-051)
        run: python3 tools/check-layers.py

      - name: SQL safety — no string-built queries (REQ-SEC-009)
        run: python3 tools/check-sql-safety.py

      - name: Real-time safety annotations (REQ-AUD-017)
        run: python3 tools/check-rt-safety.py

      # REQ-SEC-011 requires a *committed* corpus. The seeds that cannot be read
      # as bytes — MP3 frames whose LAME CRC nobody verifies by eye — are written
      # by a generator, so the committed bytes and the code that documents them
      # have to be checked against each other or the comments become fiction.
      - name: Fuzz corpus seeds are not stale (REQ-SEC-011)
        run: python3 desktop/tests/fuzz/make-seeds.py --check

      # The reader that the hardening gate depends on, checked against synthetic
      # ELF and PE binaries before it is trusted to judge real ones. It runs here
      # rather than beside the gate itself so a broken reader fails in seconds,
      # in the cheap job, instead of after a full matrix build.
      - name: Hardening reader self-test (REQ-SEC-018)
        run: python3 tools/check-hardening.py --self-test

  # -------------------------------------------------------------------------
  #  Build and test
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ubuntu-22.04 · gcc-12',  os: ubuntu-22.04, preset: linux-release, cc: gcc-12,  cxx: g++-12 }
          - { name: 'ubuntu-24.04 · gcc-13',  os: ubuntu-24.04, preset: linux-release, cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · asan',    os: ubuntu-24.04, preset: linux-asan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · tsan',    os: ubuntu-24.04, preset: linux-tsan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · clang',   os: ubuntu-24.04, preset: linux-release, cc: clang-18, cxx: clang++-18 }
          - { name: 'windows-2022 · msvc',    os: windows-2022, preset: windows-release }

    steps:
      - uses: actions/checkout@v4

      # §3.2: Ubuntu 22.04 defaults to GCC 11, whose C++20 support is incomplete.
      # The spec requires GCC 12+, so it must be installed and selected explicitly.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cxx }} \
            libsqlite3-dev zlib1g-dev pkg-config
          # Optional adapter dependencies. Failure here must not fail the build:
          # the adapters are dependency-gated by design.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libtag1-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libsamplerate0-dev || echo "some optional adapters unavailable"

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
        working-directory: desktop

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: desktop

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
        working-directory: desktop

      # REQ-GEN-015: mechanically assert the FFmpeg this build links is neither
      # GPL nor nonfree. A blocking licence gate, not a review item — §4.4.
      #
      # The build directory is asked for, never guessed. CMakePresets sets
      # binaryDir to ${sourceDir}/../build/${presetName}, which is the repository
      # root, not desktop/build — and the first version of this step tested
      # `build/<preset>/tests/test_decode` with working-directory: desktop, a path
      # that cannot exist. It took the "not applicable" branch on every run from
      # the day it was written: a licence gate that had never once executed.
      # `ctest --preset` already knows where the binaries are, so it is asked.
      #
      # The three states are kept distinct on purpose. A skip is only honest while
      # nothing in the tree links FFmpeg; once the adapter is here, an unregistered
      # licence case is a failure, because that is the exact shape of the bug this
      # step used to have.
      - name: FFmpeg licence assertion (REQ-GEN-015)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -uo pipefail
          # `ctest -N` exits non-zero when nothing matches, which is information
          # here rather than an error, hence the `|| true`.
          listing=$(ctest --preset ${{ matrix.preset }} -N -R '^FfmpegLicense\.' 2>&1 || true)
          registered=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p')
          registered=${registered:-0}

          if [ "$registered" -gt 0 ]; then
            echo "$registered FfmpegLicense case(s) registered; asserting REQ-GEN-015."
            exec ctest --preset ${{ matrix.preset }} -R '^FfmpegLicense\.' --output-on-failure
          fi

          if [ -e src/audio/decode/ffmpeg_decoder.cpp ]; then
            echo "::error::An FFmpeg adapter exists (src/audio/decode/ffmpeg_decoder.cpp)" \
                 "but no FfmpegLicense.* case is registered, so REQ-GEN-015 is unenforced." \
                 "Add the assertion test; do not relax this step."
            exit 1
          fi

          if pkg-config --exists libavformat libavcodec libavutil libswresample; then
            echo "::notice::FFmpeg is present on this runner, but no adapter in the tree" \
                 "links it yet, so REQ-GEN-015 has nothing to assert (arrives in Phase 1)."
          else
            echo "::notice::FFmpeg development packages are unavailable on this runner;" \
                 "no FFmpeg is linked and REQ-GEN-015 has nothing to assert."
          fi

      # REQ-SEC-018's operative clause: "CI MUST verify the flags are present in
      # the produced binaries, not merely in the build files." So this reads the
      # ELF headers of what was just linked. It is not run for the asan and tsan
      # presets because eclipse_set_hardening deliberately no-ops there — the
      # sanitizer runtimes are what make those suites meaningful — and the tool
      # recognises such binaries and refuses to pass a directory containing only
      # them, rather than reporting a vacuous success.
      - name: Hardening flags in the produced binaries (REQ-SEC-018)
        if: runner.os == 'Linux' && matrix.preset == 'linux-release'
        run: python3 tools/check-hardening.py build/${{ matrix.preset }}

      # The same check for PE, kept non-blocking on its first outing and only
      # its first: the PE reader has never seen a binary MSVC actually produced,
      # only the synthetic ones in --self-test, and a gate whose debut is red is
      # a gate somebody weakens instead of satisfies. The condition for removing
      # continue-on-error is one green run on this matrix entry, recorded in
      # OQ-044 — not "when convenient".
      - name: Hardening flags in the produced binaries (REQ-SEC-018, PE)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python3 tools/check-hardening.py build/${{ matrix.preset }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.name }}
          # Repository-root build/, per CMakePresets' binaryDir — the same
          # path mistake that disabled the licence gate above once made this
          # upload silently empty.
          path: build/${{ matrix.preset }}/Testing/
          retention-days: 7

  # -------------------------------------------------------------------------
  #  Fuzzing smoke — §25.2, REQ-SEC-011 (60 s per target on every PR) and
  #  REQ-SEC-012 (the targets build with ASan+UBSan).
  #
  #  Separate from the build matrix rather than bolted onto the clang entry,
  #  because it wants a different preset: `linux-fuzz` turns GoogleTest off, so
  #  a failure here is unambiguously about a fuzz target.
  #
  #  The longer runs and corpus persistence live in `security.yml` (§25.4). This
  #  job is the fast one: it proves each target still builds under libFuzzer,
  #  still replays its committed corpus, and survives a minute of mutation.
  # -------------------------------------------------------------------------
  fuzz:
    name: fuzzing smoke
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libsqlite3-dev zlib1g-dev \
            pkg-config

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset linux-fuzz
        working-directory: desktop

      # A clang build that silently falls back to corpus-replay-only would report
      # success while fuzzing nothing, which is the OQ-042 failure shape. Assert
      # the engine was actually detected before spending a minute per target.
      - name: Assert libFuzzer was detected
        run: |
          set -euo pipefail
          if ! grep -q '^ECLIPSE_HAVE_LIBFUZZER:INTERNAL=1$' \
                 build/linux-fuzz/CMakeCache.txt; then
            echo "::error::clang did not provide -fsanitize=fuzzer, so this job" \
                 "would test only the corpus replay. REQ-SEC-011 needs the engine."
            exit 1
          fi

      - name: Build
        run: cmake --build --preset linux-fuzz --parallel
        working-directory: desktop

      # The corpus first: a regression must fail before a minute is spent looking
      # for new inputs (REQ-SEC-012).
      - name: Replay the committed corpus
        run: ctest --preset linux-fuzz --output-on-failure
        working-directory: desktop

      - name: 60 s per target
        env:
          # A finding must be reported, not survived. UBSan defaults to printing
          # and continuing, which libFuzzer would not treat as a crash.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1
        run: |
          set -euo pipefail
          cd build/linux-fuzz/tests/fuzz
          status=0
          ran=0
          for target in fuzz_*; do
            case "$target" in *_replay) continue ;; esac
            [ -x "$target" ] || continue
            ran=$((ran + 1))
            echo "::group::$target"
            corpus="$GITHUB_WORKSPACE/desktop/tests/fuzz/corpus/$target"
            # -runs is a second bound: an -only_ascii-style stall must not turn
            # into a six-hour job just because the wall clock is the only limit.
            ./"$target" "$corpus" -max_total_time=60 -max_len=65536 \
                -print_final_stats=1 -artifact_prefix="$GITHUB_WORKSPACE/crash-" \
              || status=1
            echo "::endgroup::"
          done

          # Zero targets fuzzed is a failure, not a quiet success — the whole
          # point of the assertion step above, restated where it is cheap.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No libFuzzer binaries were found to run."
            exit 1
          fi
          echo "fuzzed $ran target(s) for 60 s each"
          exit $status

      # REQ-SEC-012: the input behind a finding MUST enter the regression corpus,
      # so it has to leave the runner. Uploaded on failure only, because a green
      # run has nothing to carry.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-inputs
          path: crash-*
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------------------
  #  Static analysis
  # -------------------------------------------------------------------------
  analyse:
    name: static analysis
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
            cppcheck libsqlite3-dev zlib1g-dev pkg-config

      - name: clang-format (REQ-BLD-004)
        run: |
          find desktop/src desktop/tests desktop/include -type f \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

      - name: Configure for compile database
        run: cmake --preset linux-debug
        working-directory: desktop

      - name: clang-tidy (REQ-SEC-015)
        run: |
          find src tests -name '*.cpp' -print0 \
            | xargs -0 -P 4 -n 1 clang-tidy-18 \
                -p "../build/linux-debug" --warnings-as-errors='*'
        working-directory: desktop

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr --error-exitcode=1 --quiet \
                   --std=c++20 --suppress=missingIncludeSystem \
                   -I src -I include src/
        working-directory: desktop
