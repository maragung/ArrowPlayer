name: desktop-ci

# Spec §25.2 (REQ-BLD-021). Matrix per §3.1: Windows and both Ubuntu LTS targets.
#
# Note on dependencies: the build is designed so that every external library is
# optional at configure time (see cmake/EclipseDependencies.cmake). The domain
# layer — which is where the audio maths, parsers and validators live — compiles
# and tests with nothing but a C++20 compiler. Adapters are built only where
# their library is present. That keeps this workflow fast and keeps a missing
# system package from turning into a red build for unrelated reasons.

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', 'shared-spec/**', 'tools/**', '.github/workflows/desktop-ci.yml']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION_FILE: desktop/qt-version.txt

jobs:
  # -------------------------------------------------------------------------
  #  Architecture gates — cheap, and they fail fast before any compilation.
  # -------------------------------------------------------------------------
  gates:
    name: architecture gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A gate that has never failed is not evidence. All three below run over a
      # tree that contains no violations, and check-sql-safety.py has never had
      # its matcher exercised by this repository at all — there is no SQL in it
      # yet, so its pass has never depended on the matching being right. Each
      # --self-test plants the defect its gate exists to catch, over synthetic
      # input rather than committed fixtures, and requires it to be caught. It
      # runs first: check the instruments, then take the measurement (OQ-045).
      - name: The gates can go red — negative tests (OQ-045)
        run: |
          python3 tools/check-layers.py --self-test
          python3 tools/check-sql-safety.py --self-test
          python3 tools/check-rt-safety.py --self-test

      - name: Layer dependency rules (REQ-GEN-051)
        run: python3 tools/check-layers.py

      - name: SQL safety — no string-built queries (REQ-SEC-009)
        run: python3 tools/check-sql-safety.py

      - name: Real-time safety annotations (REQ-AUD-017)
        run: python3 tools/check-rt-safety.py

      # REQ-SEC-011 requires a *committed* corpus. The seeds that cannot be read
      # as bytes — MP3 frames whose LAME CRC nobody verifies by eye — are written
      # by a generator, so the committed bytes and the code that documents them
      # have to be checked against each other or the comments become fiction.
      - name: Fuzz corpus seeds are not stale (REQ-SEC-011)
        run: python3 desktop/tests/fuzz/make-seeds.py --check

      # The reader that the hardening gate depends on, checked against synthetic
      # ELF and PE binaries before it is trusted to judge real ones. It runs here
      # rather than beside the gate itself so a broken reader fails in seconds,
      # in the cheap job, instead of after a full matrix build.
      - name: Hardening reader self-test (REQ-SEC-018)
        run: python3 tools/check-hardening.py --self-test

  # -------------------------------------------------------------------------
  #  Build and test
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ubuntu-22.04 · gcc-12',  os: ubuntu-22.04, preset: linux-release, cc: gcc-12,  cxx: g++-12 }
          - { name: 'ubuntu-24.04 · gcc-13',  os: ubuntu-24.04, preset: linux-release, cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · asan',    os: ubuntu-24.04, preset: linux-asan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · tsan',    os: ubuntu-24.04, preset: linux-tsan,    cc: gcc-13,  cxx: g++-13 }
          - { name: 'ubuntu-24.04 · clang',   os: ubuntu-24.04, preset: linux-release, cc: clang-18, cxx: clang++-18 }
          - { name: 'windows-2022 · msvc',    os: windows-2022, preset: windows-release }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # §3.2: Ubuntu 22.04 defaults to GCC 11, whose C++20 support is incomplete.
      # The spec requires GCC 12+, so it must be installed and selected explicitly.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cxx }} \
            libsqlite3-dev zlib1g-dev pkg-config
          # Optional adapter dependencies. Failure here must not fail the build:
          # the adapters are dependency-gated by design.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libtag1-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libsamplerate0-dev || echo "some optional adapters unavailable"

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      # -------------------------------------------------------------------
      #  Qt lane — §25.2 (REQ-BLD-021), ADR 0005, Phase 0 exit gate 1
      #  ("window opens") and gate 5's Qt-caching half (REQ-BLD-022).
      #
      #  Qt comes from official prebuilt binaries at the version pinned in
      #  desktop/qt-version.txt, never from vcpkg (§6.2). REQ-BLD-022 makes
      #  caching by version key mandatory: the cache below restores the whole
      #  installation under the runner tool cache, and the install step skips
      #  aqtinstall entirely when the exact version is already on disk — a
      #  cold run compiles nothing and installs from the network once, a warm
      #  run touches neither. The CMAKE_PREFIX_PATH export is unconditional,
      #  because configure must find Qt on a cache hit too.
      # -------------------------------------------------------------------
      - name: Cache Qt (REQ-BLD-022)
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Qt
          key: qt-${{ runner.os }}-${{ hashFiles('desktop/qt-version.txt') }}

      # Qt 6.8+ in the online repository bundles Qt Declarative, Qt Svg and
      # Qt Tools into the base package (the repository restructured), and aqt
      # 3.x lists the Linux arch as `linux_gcc_64`. So the only add-on this
      # build needs is qtshadertools, and the arch is the full name. Both were
      # learned the hard way: the first CI run failed with "packages were not
      # found while parsing XML" for the old module list.
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -euo pipefail
          qtver="$(cat qt-version.txt)"
          if [ -d "$RUNNER_TOOL_CACHE/Qt/$qtver/linux_gcc_64" ]; then
            echo "Qt $qtver already on disk — cache hit, not installing."
          else
            python3 -m pip install --quiet "aqtinstall==3.*"
            aqt install-qt linux desktop "$qtver" linux_gcc_64 \
              -m qtshadertools \
              -O "$RUNNER_TOOL_CACHE/Qt"
          fi
          echo "CMAKE_PREFIX_PATH=$RUNNER_TOOL_CACHE/Qt/$qtver/linux_gcc_64" >> "$GITHUB_ENV"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $qtver = Get-Content qt-version.txt
          if (Test-Path "$env:RUNNER_TOOL_CACHE\Qt\$qtver\win64_msvc2022_64") {
            Write-Output "Qt $qtver already on disk — cache hit, not installing."
          } else {
            python3 -m pip install --quiet "aqtinstall==3.*"
            aqt install-qt windows desktop $qtver win64_msvc2022_64 `
              -m qtshadertools `
              -O "$env:RUNNER_TOOL_CACHE\Qt"
          }
          "CMAKE_PREFIX_PATH=$env:RUNNER_TOOL_CACHE\Qt\$qtver\win64_msvc2022_64" `
            | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
        working-directory: desktop

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: desktop

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
        working-directory: desktop

      # Phase 0 exit gate 1 is "window opens", not "tests pass". The off-screen
      # QTest suite (test_ui) proves the window constructs and is exposed; this
      # step runs the real binary with the ECLIPSE_SMOKE_TEST seam (ui/src/
      # shell.cpp), which quits the event loop right after the first show, so
      # exit 0 here means the shipped executable actually opened a window.
      # Offscreen platform: there is no display on these runners.
      - name: Smoke — the window opens (exit gate 1)
        if: matrix.preset == 'linux-release' || matrix.preset == 'windows-release'
        env:
          QT_QPA_PLATFORM: offscreen
          ECLIPSE_SMOKE_TEST: '1'
        run: |
          set -euo pipefail
          exe="build/${{ matrix.preset }}/eclipse-player"
          if [ ! -f "$exe" ] && [ ! -f "$exe.exe" ]; then
            echo "::error::eclipse-player not found under build/${{ matrix.preset }} —"
            echo "::error::check that the UI target built (Qt present?)."
            exit 1
          fi
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe"

      # REQ-GEN-015: mechanically assert the FFmpeg this build links is neither
      # GPL nor nonfree. A blocking licence gate, not a review item — §4.4.
      #
      # The build directory is asked for, never guessed. CMakePresets sets
      # binaryDir to ${sourceDir}/../build/${presetName}, which is the repository
      # root, not desktop/build — and the first version of this step tested
      # `build/<preset>/tests/test_decode` with working-directory: desktop, a path
      # that cannot exist. It took the "not applicable" branch on every run from
      # the day it was written: a licence gate that had never once executed.
      # `ctest --preset` already knows where the binaries are, so it is asked.
      #
      # The three states are kept distinct on purpose. A skip is only honest while
      # nothing in the tree links FFmpeg; once the adapter is here, an unregistered
      # licence case is a failure, because that is the exact shape of the bug this
      # step used to have.
      - name: FFmpeg licence assertion (REQ-GEN-015)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -uo pipefail
          # `ctest -N` exits non-zero when nothing matches, which is information
          # here rather than an error, hence the `|| true`.
          listing=$(ctest --preset ${{ matrix.preset }} -N -R '^FfmpegLicense\.' 2>&1 || true)
          registered=$(printf '%s\n' "$listing" | sed -n 's/^Total Tests: *//p')
          registered=${registered:-0}

          if [ "$registered" -gt 0 ]; then
            echo "$registered FfmpegLicense case(s) registered; asserting REQ-GEN-015."
            exec ctest --preset ${{ matrix.preset }} -R '^FfmpegLicense\.' --output-on-failure
          fi

          if [ -e src/audio/decode/ffmpeg_decoder.cpp ]; then
            echo "::error::An FFmpeg adapter exists (src/audio/decode/ffmpeg_decoder.cpp)" \
                 "but no FfmpegLicense.* case is registered, so REQ-GEN-015 is unenforced." \
                 "Add the assertion test; do not relax this step."
            exit 1
          fi

          if pkg-config --exists libavformat libavcodec libavutil libswresample; then
            echo "::notice::FFmpeg is present on this runner, but no adapter in the tree" \
                 "links it yet, so REQ-GEN-015 has nothing to assert (arrives in Phase 1)."
          else
            echo "::notice::FFmpeg development packages are unavailable on this runner;" \
                 "no FFmpeg is linked and REQ-GEN-015 has nothing to assert."
          fi

      # REQ-SEC-018's operative clause: "CI MUST verify the flags are present in
      # the produced binaries, not merely in the build files." So this reads the
      # ELF headers of what was just linked. It is not run for the asan and tsan
      # presets because eclipse_set_hardening deliberately no-ops there — the
      # sanitizer runtimes are what make those suites meaningful — and the tool
      # recognises such binaries and refuses to pass a directory containing only
      # them, rather than reporting a vacuous success.
      - name: Hardening flags in the produced binaries (REQ-SEC-018)
        if: runner.os == 'Linux' && matrix.preset == 'linux-release'
        run: python3 tools/check-hardening.py build/${{ matrix.preset }}

      # The same check for PE, kept non-blocking on its first outing and only
      # its first: the PE reader has never seen a binary MSVC actually produced,
      # only the synthetic ones in --self-test, and a gate whose debut is red is
      # a gate somebody weakens instead of satisfies. The condition for removing
      # continue-on-error is one green run on this matrix entry, recorded in
      # OQ-044 — not "when convenient".
      - name: Hardening flags in the produced binaries (REQ-SEC-018, PE)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python3 tools/check-hardening.py build/${{ matrix.preset }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-output-${{ matrix.name }}
          # Repository-root build/, per CMakePresets' binaryDir — the same
          # path mistake that disabled the licence gate above once made this
          # upload silently empty.
          path: build/${{ matrix.preset }}/Testing/
          retention-days: 7

  # -------------------------------------------------------------------------
  #  Fuzzing smoke — §25.2, REQ-SEC-011 (60 s per target on every PR) and
  #  REQ-SEC-012 (the targets build with ASan+UBSan).
  #
  #  Separate from the build matrix rather than bolted onto the clang entry,
  #  because it wants a different preset: `linux-fuzz` turns GoogleTest off, so
  #  a failure here is unambiguously about a fuzz target.
  #
  #  The longer runs and corpus persistence live in `security.yml` (§25.4). This
  #  job is the fast one: it proves each target still builds under libFuzzer,
  #  still replays its committed corpus, and survives a minute of mutation.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  #  The vcpkg lane — REQ-BLD-022, OQ-026, Phase 0 exit gate 5.
  #
  #  The matrix above installs FFmpeg, TagLib and the rest with apt. That is why
  #  it is fast, and it is also why the manifest this repository commits has
  #  never been exercised: §6.2 says every non-Qt dependency comes from vcpkg in
  #  manifest mode, and REQ-BLD-022 makes binary caching mandatory rather than
  #  optional. A mandatory cache with nothing to cache is not a satisfied
  #  requirement. OQ-026 records the two-lane answer; this is the second lane.
  #
  #  Not on pull requests. A cold cache here builds ffmpeg, projectm, chromaprint
  #  and soundtouch from source, and OQ-026's whole reason for keeping apt was to
  #  avoid putting that in front of every review. It runs on main, and on demand.
  #
  #  Honest limit: vcpkg is not installed on the machine where this job was
  #  written, so unlike every other step in this file its shell was reasoned
  #  about rather than executed — the accounting step below was exercised against
  #  synthetic logs built from vcpkg's real message catalogue, which is not the
  #  same as having seen vcpkg print them. Nothing has been pushed either, so no run of it
  #  exists. The summary it writes says which run it is, because on a cold cache
  #  "0 restored" is the correct result and only the *next* run is evidence for
  #  gate 5's "second run substantially faster".
  # -------------------------------------------------------------------------
  vcpkg:
    name: vcpkg manifest · binary cache
    needs: gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # VCPKG_BINARY_SOURCES lives on the install step, not here: the `runner`
    # context is unavailable in job-level env, and this expression was exactly
    # that — written before anything had ever run, it would have failed the
    # workflow at parse time on its first push.
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build dependencies vcpkg itself needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 pkg-config \
            autoconf automake libtool nasm

      # The key is everything that changes what gets built: the manifest, the
      # overlay triplets, and the baseline the manifest pins. Not the commit —
      # keying on that would guarantee a miss on every push, which is a cache
      # that exists and never works.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-x64-linux-eclipse-${{ hashFiles('desktop/vcpkg.json', 'desktop/vcpkg-configuration.json', 'desktop/cmake/triplets/*.cmake') }}
          # A partial restore is worth having: one changed port should not mean
          # rebuilding the other eight.
          restore-keys: |
            vcpkg-x64-linux-eclipse-

      # Read, not written twice. The baseline lives in desktop/vcpkg.json and
      # REQ-SEC-013 is about versions not floating; a hash copied into this file
      # would be a second place for it to drift. Manifest mode also *requires*
      # the checkout to contain that commit, so a preinstalled vcpkg of some
      # other vintage is not usable here.
      - name: Check out vcpkg at the manifest's own baseline
        run: |
          set -euo pipefail
          baseline=$(python3 -c "
          import json; print(json.load(open('desktop/vcpkg.json'))['builtin-baseline'])")
          echo "builtin-baseline: $baseline"
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Install the manifest
        id: install
        env:
          CC: gcc-13
          CXX: g++-13
          # A `files` provider under RUNNER_TEMP, persisted by actions/cache.
          #
          # NOT x-gha. The first draft of this job used it, because that is what
          # every tutorial still shows. The pinned baseline resolves vcpkg-tool
          # release 2026-07-27, and that release's own message catalogue contains
          # GhaBinaryCacheDeprecated: "The 'x-gha' binary caching backend has been
          # removed." Configuring a removed backend is how a mandatory cache
          # becomes a job that compiles everything and still reports success.
          #
          # `clear` first so nothing inherits vcpkg's default local cache: on a
          # runner that is a fresh empty directory, and a provider that can only
          # ever miss is indistinguishable from no provider at all.
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.temp }}/vcpkg-cache,readwrite'
        working-directory: desktop
        run: |
          set -euo pipefail
          # The overlay triplets are relative to vcpkg-configuration.json, which
          # is why this runs from desktop/ rather than the repository root.
          set +e
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-linux-eclipse \
            --host-triplet x64-linux-eclipse \
            --x-manifest-root . \
            2>&1 | tee "$RUNNER_TEMP/vcpkg-install.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Did the cache actually do anything?
        if: always() && steps.install.outputs.rc != ''
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/vcpkg-install.log"

          # Read once, and fail loudly if it comes back empty. Interpolating a
          # command substitution straight into an echo swallows its failure: a
          # wrong working directory would have printed a blank baseline into the
          # summary and gone green, which is how this very step first behaved
          # under test.
          baseline=$(python3 -c "
          import json; print(json.load(open('desktop/vcpkg.json'))['builtin-baseline'])" \
                     2>/dev/null || true)
          if [ -z "$baseline" ]; then
            echo "::error::Could not read builtin-baseline from desktop/vcpkg.json."
            echo "::error::This step runs from the repository root; check the path."
            exit 1
          fi
          # vcpkg's own accounting, and its own wording. Both patterns below are
          # message strings taken from vcpkg-tool 2026-07-27's locales catalogue,
          # the release this manifest's baseline pins:
          #   RestoredPackagesFromFiles  "Restored {count} package(s) from {path}
          #                               in {elapsed}."
          #   PackagesCached             "All packages already exist in the binary
          #                               cache. Installation skipped."
          # The second matters: on a fully warm run there may be nothing to
          # restore *because* everything is already accounted for, and a guard
          # that only knew the first pattern would fail the best possible run.
          restored=$(grep -oE 'Restored [0-9]+ package' "$log" \
                     | grep -oE '[0-9]+' | tail -1 || true)
          built=$(grep -cE '^Building [a-z0-9-]+' "$log" || true)
          restored=${restored:-0}; built=${built:-0}
          if grep -qF 'All packages already exist in the binary cache' "$log"; then
            fully_cached=yes
          else
            fully_cached=no
          fi

          if [ "$fully_cached" = "no" ] \
             && ! grep -qE 'Restored [0-9]+ package' "$log"; then
            echo "::error::The install log has neither a 'Restored N package(s)' line"
            echo "::error::nor 'All packages already exist in the binary cache'. Those"
            echo "::error::are the only two things vcpkg 2026-07-27 says when a binary"
            echo "::error::provider is active, so no provider was active: it built"
            echo "::error::everything from source and would still have gone green."
            echo "::error::REQ-BLD-022 is not satisfied by a cache that is not there."
            echo "::error::Check VCPKG_BINARY_SOURCES — and note that x-gha was removed"
            echo "::error::in this tool release, so a copied x-gha recipe lands here."
            exit 1
          fi

          {
            echo "### vcpkg binary cache (REQ-BLD-022, Phase 0 exit gate 5)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Restored from cache | **$restored** package(s) |"
            echo "| Built from source | **$built** package(s) |"
            echo "| Baseline | \`$baseline\` |"
            echo
            if [ "$fully_cached" = "yes" ]; then
              echo "**Fully cached.** vcpkg reported that every package already"
              echo "existed in the binary cache and skipped installation outright —"
              echo "the strongest form of what \`REQ-BLD-022\` asks for."
            elif [ "$restored" -eq 0 ]; then
              echo "**Cold cache.** Zero restored is the correct result for the first"
              echo "run against a given baseline and triplet — there was nothing to"
              echo "restore. It is *not* evidence for gate 5, which asks that a second"
              echo "run be substantially faster. The next run on this baseline is the"
              echo "evidence; until one exists, \`OQ-026\` stays open."
            else
              echo "**Warm cache.** $restored package(s) came back from the restored"
              echo "cache instead of being compiled, which is what \`REQ-BLD-022\`"
              echo "requires and what gate 5 asks to be demonstrated."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The manifest is what was resolved (REQ-SEC-013)
        if: always() && steps.install.outputs.rc == '0'
        working-directory: desktop
        run: |
          set -euo pipefail
          # Two facts worth failing on rather than trusting. Qt must never come
          # from vcpkg (§6.2, ADR 0005), and ffmpeg must be the overridden 7.1.x
          # the register names — not the baseline's newer default.
          if "$VCPKG_ROOT/vcpkg" list | grep -qiE '^qt'; then
            echo "::error::A Qt port is installed from vcpkg. §6.2 forbids it and"
            echo "::error::desktop/vcpkg.json says so in \$no-qt. ADR 0005 is the record."
            exit 1
          fi
          want=$(python3 -c "
          import json
          o=[x for x in json.load(open('vcpkg.json'))['overrides'] if x['name']=='ffmpeg'][0]
          print(o['version'])")
          got=$("$VCPKG_ROOT/vcpkg" list ffmpeg | head -1 || true)
          echo "override wants ffmpeg $want; vcpkg reports: ${got:-<nothing>}"
          case "$got" in
            *"$want"*) echo "ffmpeg matches the override." ;;
            *) echo "::error::ffmpeg is not $want. The override in desktop/vcpkg.json"
               echo "::error::exists because §6.3 and the §4.2 register both name 7.1.x;"
               echo "::error::a floating resolve is what REQ-SEC-013 forbids."
               exit 1 ;;
          esac

  fuzz:
    name: fuzzing smoke
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libsqlite3-dev zlib1g-dev \
            pkg-config

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset linux-fuzz
        working-directory: desktop

      # A clang build that silently falls back to corpus-replay-only would report
      # success while fuzzing nothing, which is the OQ-042 failure shape. Assert
      # the engine was actually detected before spending a minute per target.
      - name: Assert libFuzzer was detected
        run: |
          set -euo pipefail
          if ! grep -q '^ECLIPSE_HAVE_LIBFUZZER:INTERNAL=1$' \
                 build/linux-fuzz/CMakeCache.txt; then
            echo "::error::clang did not provide -fsanitize=fuzzer, so this job" \
                 "would test only the corpus replay. REQ-SEC-011 needs the engine."
            exit 1
          fi

      - name: Build
        run: cmake --build --preset linux-fuzz --parallel
        working-directory: desktop

      # The corpus first: a regression must fail before a minute is spent looking
      # for new inputs (REQ-SEC-012).
      - name: Replay the committed corpus
        run: ctest --preset linux-fuzz --output-on-failure
        working-directory: desktop

      - name: 60 s per target
        env:
          # A finding must be reported, not survived. UBSan defaults to printing
          # and continuing, which libFuzzer would not treat as a crash.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: abort_on_error=1
        run: |
          set -euo pipefail
          cd build/linux-fuzz/tests/fuzz
          status=0
          ran=0
          for target in fuzz_*; do
            case "$target" in *_replay) continue ;; esac
            [ -x "$target" ] || continue
            ran=$((ran + 1))
            echo "::group::$target"
            corpus="$GITHUB_WORKSPACE/desktop/tests/fuzz/corpus/$target"
            # -runs is a second bound: an -only_ascii-style stall must not turn
            # into a six-hour job just because the wall clock is the only limit.
            ./"$target" "$corpus" -max_total_time=60 -max_len=65536 \
                -print_final_stats=1 -artifact_prefix="$GITHUB_WORKSPACE/crash-" \
              || status=1
            echo "::endgroup::"
          done

          # Zero targets fuzzed is a failure, not a quiet success — the whole
          # point of the assertion step above, restated where it is cheap.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No libFuzzer binaries were found to run."
            exit 1
          fi
          echo "fuzzed $ran target(s) for 60 s each"
          exit $status

      # REQ-SEC-012: the input behind a finding MUST enter the regression corpus,
      # so it has to leave the runner. Uploaded on failure only, because a green
      # run has nothing to carry.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-inputs
          path: crash-*
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------------------
  #  Static analysis
  # -------------------------------------------------------------------------
  analyse:
    name: static analysis
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy-18 clang-format-18 \
            cppcheck libsqlite3-dev zlib1g-dev pkg-config

      - name: clang-format (REQ-BLD-004)
        run: |
          find desktop/src desktop/tests desktop/include -type f \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

      - name: Configure for compile database
        run: cmake --preset linux-debug
        working-directory: desktop

      - name: clang-tidy (REQ-SEC-015)
        run: |
          find src tests -name '*.cpp' -print0 \
            | xargs -0 -P 4 -n 1 clang-tidy-18 \
                -p "../build/linux-debug" --warnings-as-errors='*'
        working-directory: desktop

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr --error-exitcode=1 --quiet \
                   --std=c++20 --suppress=missingIncludeSystem \
                   -I src -I include src/
        working-directory: desktop
