# ---------------------------------------------------------------------------
#  release.yml — spec §25.5 (REQ-BLD-025, REQ-BLD-026)
#
#  §25.5 lists ten steps. On a `vX.Y.Z` tag this workflow now runs eight of
#  them for real: the semver/version-file check (1), the full pipelines (3),
#  per-platform artifacts (4), SBOMs and SHA-256 checksums (6), the changelog
#  (7), the licence documents (8), the unified GitHub Release (9). The two it
#  cannot do are named rather than faked: step 5 (signing, REQ-SEC-016) has no
#  identity to sign with, and step 10's "every artifact smoke-tested" is served
#  by the offscreen smoke step in the artifacts job but the full
#  install-in-a-clean-container ritual is Phase 9 work.
#
#  ADR 0012 restored the Android target, so the APKs come from android-ci.yml's
#  `release` job (also triggered by the tag) and this workflow's publish job
#  uploads the desktop artifacts to the same release. The two create/upload
#  pairs are idempotent because either workflow may reach the release first.
#
#  Artifacts are UNSIGNED until a signing identity exists. That is a stated
#  fact in the release notes, not a surprise discovered at install time, and it
#  is the same refusal REQ-SEC-016 describes — the release exists, and so does
#  the gap, and both are visible.
#
#  workflow_dispatch is not a convenience. A release workflow first exercised at
#  release time is the classic way releases fail, so every step that does not
#  need a tag is runnable without cutting one.
#
#  Nothing in this file has ever executed: nothing has been pushed to origin and
#  no tag exists. Every claim about it in docs/ says so.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Deliberately read-only. Publishing needs contents: write, and the job that
# would publish cannot yet — granting the token write access before anything
# uses it is privilege nobody is holding.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight. A half-cancelled release is worse than a
  # slow one.
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  #  Steps 1 and 2 · The preconditions, checked before anything expensive runs.
  #
  #  Also step 8's precondition, which is not obvious from §25.5 and was found
  #  by running the generator rather than by reading it: gen-third-party.py
  #  refuses to emit docs/LGPL-SOURCE-OFFER.md when the ledger records a
  #  published release while offer.postal_address is null, because a written
  #  offer that names no reachable recipient is not an offer (OQ-013). Step 8
  #  therefore cannot succeed on any tag until that field is filled in. Checked
  #  here so the failure arrives before the pipeline spends twenty minutes.
  # -------------------------------------------------------------------------
  preflight:
    name: preconditions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.version.outputs.tagged }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the changelog needs history, not a shallow clone

      - name: Step 1 · the tag is semver and matches the build files
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file_version=$(tr -d '[:space:]' < desktop/version.txt)
          echo "desktop/version.txt: $file_version"

          if [ "$REF_TYPE" != "tag" ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "version=$file_version" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a tag ref — running the tag-independent steps only."
            exit 0
          fi

          # §25.5 step 1 says vX.Y.Z. Exactly that: no prerelease suffix, no
          # build metadata, no leading zeroes.
          if ! printf '%s' "$REF_NAME" \
               | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Tag '$REF_NAME' is not vX.Y.Z (REQ-BLD-025 step 1)."
            exit 1
          fi
          tag_version="${REF_NAME#v}"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag says $tag_version, desktop/version.txt says $file_version."
            echo "::error::The version lives in the file; the tag records it. Fix the file"
            echo "::error::and retag rather than moving the tag."
            exit 1
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "Tag $REF_NAME matches desktop/version.txt."

      - name: Step 2 · the 1.0.0 release checklist
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGGED: ${{ steps.version.outputs.tagged }}
        run: |
          set -euo pipefail
          # §25.5 step 2 is scoped to the 1.0.0 tag specifically. Below 1.0.0
          # there is nothing to refuse on, and saying so is different from
          # skipping a check that applies.
          if [ "$TAGGED" != "true" ] || [ "$VERSION" != "1.0.0" ]; then
            echo "Not the 1.0.0 tag (version $VERSION) — step 2 does not apply."
            exit 0
          fi
          if [ ! -f docs/RELEASE-CHECKLIST.md ]; then
            echo "::error::REQ-BLD-025 step 2: the 1.0.0 tag must be refused if any"
            echo "::error::[v1.0] requirement is marked unmet in the release checklist,"
            echo "::error::and docs/RELEASE-CHECKLIST.md does not exist. There is no"
            echo "::error::checklist to read, so the refusal cannot be evaluated."
            exit 1
          fi
          unmet=$(grep -nE '^\s*-\s*\[ \]' docs/RELEASE-CHECKLIST.md || true)
          if [ -n "$unmet" ]; then
            echo "::error::REQ-BLD-025 step 2: unmet items in the release checklist."
            echo "$unmet" | sed 's/^/  /'
            exit 1
          fi
          echo "Release checklist has no unticked items."

      - name: Step 8's precondition · the source offer names a recipient
        env:
          TAGGED: ${{ steps.version.outputs.tagged }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Asked, not predicted. gen-third-party.py refuses to emit
          # docs/LGPL-SOURCE-OFFER.md when the ledger records a published release
          # while offer.postal_address is null, because a written offer that names
          # no reachable recipient is not an offer (OQ-013). Step 8 must append
          # such an entry for this tag, so on a tag that refusal is fatal — and
          # arriving at step 8 of 10 to find out is arriving late.
          #
          # This probes the generator with a throwaway ledger rather than
          # re-implementing its condition here. A copy of the condition in this
          # file would be a copy that drifts; the first draft of this step already
          # drifted, checking `mailbox` too, which would have failed tags the
          # generator accepts. The probe's release row is deliberately incomplete,
          # so the generator also complains about the row — irrelevant, because the
          # row is thrown away. The discriminator is whether OQ-013 is named.
          python3 - "$VERSION" > /tmp/offer-probe.json <<'PY'
          import json, sys
          d = json.load(open("tools/gen-third-party/releases.json"))
          d["releases"] = [{"tag": f"v{sys.argv[1]}", "date": "1970-01-01",
                            "components": []}]
          json.dump(d, open(1, "w"), indent=2)
          PY
          probe=$(python3 tools/gen-third-party/gen-third-party.py \
                    --document source-offer --releases /tmp/offer-probe.json \
                    --output /dev/null 2>&1 || true)
          if ! printf '%s' "$probe" | grep -q 'OQ-013'; then
            echo "The offer names a recipient channel — step 8 can append this tag."
            exit 0
          fi
          reason=$(printf '%s' "$probe" | grep -o 'offer\.postal_address is null.*' | head -1)
          if [ "$TAGGED" != "true" ]; then
            echo "::notice::$reason"
            echo "::notice::Not a tag, so nothing is being distributed and no source"
            echo "::notice::obligation attaches yet. On a tag this step fails."
            exit 0
          fi
          echo "::error::$reason"
          echo "::error::Fill offer.postal_address in tools/gen-third-party/releases.json"
          echo "::error::before tagging. Failing here rather than at step 8 of 10."
          exit 1

      - name: The previous tag, for the changelog range
        id: previous
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "::notice::No previous tag; the changelog range starts at the root commit."
          else
            echo "Previous tag: $prev"
          fi
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  #  Step 7 · The changelog, from conventional commits.
  #
  #  REQ-BLD-036 splits the file: the detail sections are generated, the
  #  Highlights section is written by a human. tools/gen-changelog.py generates
  #  the first half and refuses to fabricate the second, so this job produces
  #  something a human finishes rather than something that looks finished.
  # -------------------------------------------------------------------------
  changelog:
    name: changelog (step 7)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The generator's own scenarios first. A broken generator fails in the
      # direction of an empty changelog, which reads as "nothing changed".
      - name: The generator still behaves as committed
        run: python3 tools/gen-changelog.py --self-test

      - name: Generate
        env:
          PREVIOUS: ${{ needs.preflight.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS" ]; then
            python3 tools/gen-changelog.py --from "$PREVIOUS" --output changelog-section.md
          else
            python3 tools/gen-changelog.py --output changelog-section.md
          fi
          {
            echo "### Generated changelog section"
            echo
            cat changelog-section.md
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog-section
          path: changelog-section.md
          retention-days: 90

  # -------------------------------------------------------------------------
  #  Step 6 · SBOM. Half of this step exists.
  #
  #  "Generate SBOMs and SHA-256 checksums" — the SBOM is generated from the
  #  §4.2 register and is real. The checksums are of artifacts, and there are no
  #  artifacts, so that half is reported as missing rather than satisfied by
  #  checksumming the SBOM itself.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM (step 6)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The generator still behaves as committed
        run: python3 tools/gen-sbom.py --self-test

      # The committed baseline carries no timestamp or serial so that --check
      # stays meaningful. The release copy carries both, which is why it is a
      # separate file and not a regeneration in place.
      - name: The committed baseline is not stale
        run: python3 tools/gen-sbom.py --check

      - name: Stamp a release copy
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          serial="urn:uuid:$(cat /proc/sys/kernel/random/uuid)"
          out="eclipse-player-${VERSION}.cdx.json"
          python3 tools/gen-sbom.py --timestamp "$stamp" --serial-number "$serial" -o "$out"
          sha256sum "$out" > "$out.sha256"
          {
            echo "### SBOM"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Document | \`$out\` |"
            echo "| Timestamp | \`$stamp\` |"
            echo "| Serial | \`$serial\` |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 < "$out.sha256")\` |"
            echo
            echo "**Half of §25.5 step 6 is missing.** The step asks for SBOMs *and*"
            echo "SHA-256 checksums. The checksum above is of the SBOM, not of a release"
            echo "artifact — no \`install()\` or \`CPack\` rule in this tree produces one."
            echo "Checksumming the SBOM and calling step 6 done would be the failure"
            echo "\`OQ-042\` records. See the publish job."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            eclipse-player-*.cdx.json
            eclipse-player-*.cdx.json.sha256
          retention-days: 90

  # -------------------------------------------------------------------------
  #  Step 8 · The licence documents for this tag.
  #
  #  "Regenerate docs/THIRD-PARTY.md and the LGPL source-offer entries for this
  #  tag (REQ-GEN-020) and fail if they are stale." Both documents are generated
  #  from data, so staleness is checkable today. Appending the tag's ledger entry
  #  is what OQ-013 blocks; preflight has already refused the tag in that case,
  #  so reaching this job on a tag means the offer names a recipient.
  # -------------------------------------------------------------------------
  third-party:
    name: licence documents (step 8)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The generator still behaves as committed
        run: python3 tools/gen-third-party/gen-third-party.py --self-test

      - name: Neither document is stale
        run: |
          set -euo pipefail
          python3 tools/gen-third-party/gen-third-party.py --check
          python3 tools/gen-third-party/gen-third-party.py --check --document source-offer

      - name: What appending the tag's ledger entry still needs
        env:
          TAGGED: ${{ needs.preflight.outputs.tagged }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          published=$(python3 -c "
          import json
          print(len(json.load(open('tools/gen-third-party/releases.json'))['releases']))")
          {
            echo "### Licence documents"
            echo
            echo "Both documents regenerate byte-identically from"
            echo "\`tools/gen-third-party/register.json\`, so neither is stale."
            echo
            echo "The per-tag ledger holds **$published** published release(s)."
            if [ "$TAGGED" = "true" ]; then
              echo "Appending the entry for \`v$VERSION\` is the remaining half of step 8:"
              echo "it asserts that a binary was distributed and that these archives"
              echo "correspond to it. There is no binary yet — see the publish job — so"
              echo "the entry is not written, because writing it would assert something"
              echo "false about a release that did not happen."
            else
              echo "This run is not on a tag, so no entry is appended and no source"
              echo "obligation attaches."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  #  Steps 3 (desktop half) and 4 · Build and package the Windows and Ubuntu
  #  binaries on a tag.
  #
  #  Packaging lives here in the workflow rather than in CMake because the Qt
  #  prefix it needs is a CI environment fact. Linux gets a tar.gz of the
  #  binary plus the Qt libraries and plugins it needs (runnable on a stock
  #  desktop); Windows gets a windeployqt zip (self-contained). Both are
  #  smoke-tested offscreen before upload — REQ-BLD-016's "launch it and verify
  #  the version string" half; the clean-container install ritual is Phase 9.
  # -------------------------------------------------------------------------
  artifacts:
    name: artifacts · ${{ matrix.name }}
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-x86_64, os: ubuntu-24.04, preset: linux-release, cc: gcc-13, cxx: g++-13 }
          - { name: windows-x64,   os: windows-2022, preset: windows-release }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cxx }} \
            libsqlite3-dev zlib1g-dev pkg-config
          # Qt 6.8's Gui config hard-requires WrapOpenGL, XKB and Vulkan headers
          # at find_package time; without them the artifact build silently
          # produces a UI-less binary and the smoke step fails (same fix as
          # desktop-ci.yml's Qt lane).
          sudo apt-get install -y \
            libgl1-mesa-dev libglvnd-dev libxkbcommon-dev libvulkan-dev

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      # The Qt lane, same shape as desktop-ci.yml: cache by version key, skip
      # aqtinstall on a hit, export the prefix unconditionally.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/Qt
          key: qt-${{ runner.os }}-${{ hashFiles('desktop/qt-version.txt') }}

      # Same repository reality as desktop-ci.yml: Qt 6.8+ bundles Qt
      # Declarative/Svg/Tools into the base package and aqt 3.x wants the
      # `linux_gcc_64` arch name; qtshadertools is the one add-on needed.
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -euo pipefail
          qtver="$(cat qt-version.txt)"
          if [ ! -d "$RUNNER_TOOL_CACHE/Qt/$qtver/gcc_64" ]; then
            python3 -m pip install --quiet "aqtinstall==3.*"
            aqt install-qt linux desktop "$qtver" linux_gcc_64 \
              -m qtshadertools \
              -O "$RUNNER_TOOL_CACHE/Qt"
          fi
          # aqt's arch argument (`linux_gcc_64`) extracts into a `gcc_64` dir.
          echo "CMAKE_PREFIX_PATH=$RUNNER_TOOL_CACHE/Qt/$qtver/gcc_64" >> "$GITHUB_ENV"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop
        run: |
          $qtver = Get-Content qt-version.txt
          if (-not (Test-Path "$env:RUNNER_TOOL_CACHE\Qt\$qtver\msvc2022_64")) {
            python3 -m pip install --quiet "aqtinstall==3.*"
            aqt install-qt windows desktop $qtver win64_msvc2022_64 `
              -m qtshadertools `
              -O "$env:RUNNER_TOOL_CACHE\Qt"
          }
          # Same mapping as Linux: `win64_msvc2022_64` extracts to `msvc2022_64`.
          "CMAKE_PREFIX_PATH=$env:RUNNER_TOOL_CACHE\Qt\$qtver\msvc2022_64" `
            | Out-File -FilePath $env:GITHUB_ENV -Append
          # Qt is dynamically linked (REQ-GEN-013); Windows resolves those DLLs
          # from PATH, so test_ui (and the app during smoke) needs the Qt bin
          # directory there or it exits 0xc0000135 (DLL not found).
          "PATH=$env:RUNNER_TOOL_CACHE\Qt\$qtver\msvc2022_64\bin;$env:PATH" `
            | Out-File -FilePath $env:GITHUB_ENV -Append

      # Same vcpkg-guard as desktop-ci.yml: the windows-2022 runner sets
      # VCPKG_ROOT to Visual Studio's bundled vcpkg, which would auto-activate
      # manifest mode with the default x64-windows triplet and hit the upstream
      # ffmpeg zlib.lib port bug. The empty toolchain file keeps the vcpkg
      # branch in CMakeLists.txt off; this lane builds Qt + vendored gtest.
      - name: Configure
        shell: bash  # Git Bash ships on windows-2022; RUNNER_OS is case-sensitively 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          extra=""
          [ "$RUNNER_OS" = "Windows" ] && extra="-DCMAKE_TOOLCHAIN_FILE="
          cmake --preset ${{ matrix.preset }} $extra
        working-directory: desktop

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        working-directory: desktop

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4
        working-directory: desktop

      # REQ-BLD-016: smoke the artifact, not just the build tree — the binary
      # that ships must open a window and exit 0 doing so.
      - name: Smoke — window opens (REQ-BLD-016)
        env:
          QT_QPA_PLATFORM: offscreen
          ECLIPSE_SMOKE_TEST: '1'
        run: |
          set -euo pipefail
          exe="build/${{ matrix.preset }}/eclipse-player"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < desktop/version.txt)"
          qtver="$(cat desktop/qt-version.txt)"
          qtprefix="$RUNNER_TOOL_CACHE/Qt/$qtver/gcc_64"
          staging="$RUNNER_TEMP/pkg"
          rm -rf "$staging"; mkdir -p "$staging/bin" "$staging/lib" \
            "$staging/plugins" "$staging/share/doc/eclipse-player"
          # The real binary under its own name; a wrapper in front of it sets
          # LD_LIBRARY_PATH and QT_PLUGIN_PATH to the bundled copies.
          cp build/linux-release/eclipse-player "$staging/bin/eclipse-player.bin"
          cp -rL "$qtprefix"/lib/libQt6*.so* "$staging/lib/"
          cp -rL "$qtprefix"/lib/libicu*.so* "$staging/lib/" 2>/dev/null || true
          cp -r "$qtprefix/plugins/platforms" "$staging/plugins/"
          cp -r "$qtprefix/plugins/imageformats" "$staging/plugins/" 2>/dev/null || true
          cp -r "$qtprefix/plugins/xcbglintegrations" "$staging/plugins/" 2>/dev/null || true
          cp LICENSE "$staging/share/doc/eclipse-player/"
          cp desktop/qt-version.txt "$staging/share/doc/eclipse-player/qt-version.txt"
          cat > "$staging/bin/eclipse-player" <<'WRAPPER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/bin/eclipse-player.bin" "$@"
          WRAPPER
          chmod +x "$staging/bin/eclipse-player"
          (cd "$staging" && tar czf \
            "$RUNNER_TEMP/eclipse-player-$version-linux-x86_64.tar.gz" .)
          sha256sum "$RUNNER_TEMP/eclipse-player-$version-linux-x86_64.tar.gz" \
            > "$RUNNER_TEMP/eclipse-player-$version-linux-x86_64.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.txt).Trim()
          $qtver = Get-Content desktop/qt-version.txt
          $qtbin = "$env:RUNNER_TOOL_CACHE\Qt\$qtver\msvc2022_64\bin"
          $staging = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build/windows-release/eclipse-player.exe $staging
          # windeployqt bundles the Qt DLLs and the platform plugin, so the zip
          # runs on a stock Windows 10/11 without installing Qt.
          & "$qtbin\windeployqt.exe" --release --no-translations "$staging\eclipse-player.exe"
          Copy-Item LICENSE $staging
          Copy-Item desktop/qt-version.txt "$staging\qt-version.txt"
          $zip = "$env:RUNNER_TEMP\eclipse-player-$version-windows-x64.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  eclipse-player-$version-windows-x64.zip" | Out-File "$zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/eclipse-player-*.tar.gz
            ${{ runner.temp }}/eclipse-player-*.tar.gz.sha256
            ${{ runner.temp }}/eclipse-player-*.zip
            ${{ runner.temp }}/eclipse-player-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  #  Steps 3 (desktop half), 4, 6, 9, 10 · Publish one unified GitHub Release.
  #
  #  The Android APKs arrive from android-ci.yml's `release` job, which this
  #  same tag triggers; both jobs create/upload idempotently so the release
  #  exists whichever gets there first. Step 5 (signing, REQ-SEC-016) is the
  #  one §25.5 step this workflow refuses — no identity exists, and a fake
  #  signature is worse than none. The refusal is reported, not hidden.
  # -------------------------------------------------------------------------
  publish:
    name: publish (steps 3, 4, 6, 9, 10; 5 refused)
    needs: [preflight, changelog, sbom, third-party, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: What publishing still needs
        env:
          HAS_SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          missing=()
          # Step 5 is the one gap left by design (REQ-SEC-016, Phase 9).
          if [ "$HAS_SIGNING_IDENTITY" != "true" ]; then
            missing+=("signing|no \`RELEASE_SIGNING_IDENTITY\` secret, so nothing is signed and \`REQ-SEC-016\` is unmet|Phase 9 (\"signing\")")
          fi
          {
            echo "### Release status"
            echo
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "**Not signing.** §25.5 step 5 is refused, not skipped:"
              echo
              echo "| Missing | Why | Owned by |"
              echo "|---|---|---|"
              for entry in "${missing[@]}"; do
                IFS='|' read -r what why owner <<< "$entry"
                echo "| \`$what\` | $why | $owner |"
              done
              echo
            else
              echo "**Signing identity present.** If a tag run publishes, step 5"
              echo "should be wired to it; nothing here does that yet."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '%s\n' "${missing[@]}" | cut -d'|' -f1 | sed 's/^/  missing: /'
          fi

      - name: Create the release and upload the desktop artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Eclipse Player $TAG"
            echo
            echo "**Unsigned.** No \`RELEASE_SIGNING_IDENTITY\` exists (REQ-SEC-016 is"
            echo "Phase 9 work), so every artifact below is distributed without a"
            echo "signature. Verify the SHA-256 checksums beside each file."
            echo
            echo "### Desktop"
            echo
            echo "- \`eclipse-player-$version-windows-x64.zip\` — self-contained, Qt bundled"
            echo "  by windeployqt"
            echo "- \`eclipse-player-$version-linux-x86_64.tar.gz\` — binary plus the Qt"
            echo "  libraries and plugins it needs; built on Ubuntu 24.04, needs a"
            echo "  stock desktop with X11/libxcb"
            echo
            echo "### Android"
            echo
            echo "- Per-ABI APKs are uploaded to this release by \`android-ci.yml\`'s"
            echo "  release job; unsigned until a signing identity exists."
            echo
            echo "### Checksums and SBOM"
            echo
            echo "- SHA-256 for every artifact, plus the CycloneDX SBOM, are attached."
          } > "$notes"

          # Every other job of this run uploaded artifacts; fetch them all, then
          # create the release idempotently (android-ci may have got there first)
          # and upload what this workflow built.
          gh run download "$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/release" >/dev/null
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" >/dev/null 2>&1 || true
          gh release upload "$TAG" "$RUNNER_TEMP"/release/artifact-*/* --clobber
          gh release upload "$TAG" "$RUNNER_TEMP"/release/sbom/* --clobber
          gh release upload "$TAG" "$RUNNER_TEMP"/release/changelog-section/* --clobber
          echo "::notice::Released $TAG — desktop artifacts from this workflow, Android"
          echo "::notice::APKs from android-ci.yml, all unsigned (REQ-SEC-016)."
