name: repo-lint

# Repository-hygiene gates: Markdown style, commit-message form, and the §27
# documentation checks — every listed document present, every internal link
# resolving, and the three generated documents (both licence documents and the
# CycloneDX SBOM) in step with the one register they all come from.
#
# Why this is a sixth workflow when §5 lists five. The five in §5 map to the
# specification's own concerns — the two platforms, the shared spec, security,
# and release. Markdown style and commit-message form belong to none of them, and
# the alternative was to hang them off desktop-ci.yml, whose `paths` filter is
# ['desktop/**', 'shared-spec/**', 'tools/**', …]. That filter would skip these
# checks on exactly the pull requests they exist to check: documentation-only
# ones. A gate that is silent on the changes it governs is not a gate, so it gets
# its own file with no `paths` filter at all. Recorded as OQ-030.
#
# Both tools are pinned exactly in package.json and installed with `npm ci` from
# the committed lockfile: REQ-SEC-013 is about not letting tooling move under the
# project, and `npx <tool>` resolves whatever the registry serves today. That is
# how the Markdown gate came to run a version nobody chose (OQ-028).
#
# The actions these jobs run are pinned by the same argument, which for three
# commits they were not: `uses: actions/checkout@v4` resolves through a tag its
# owner can move. The `action-pins` job below enforces the pins so the argument
# survives the next person who adds a step (OQ-050).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # No arguments, deliberately. The file set and the exclusions live in
      # .markdownlint-cli2.jsonc; passing a glob here is precisely how the wrong
      # file set got linted for three commits (OQ-028). If this needs to lint
      # something different, the config changes, not the command.
      - name: Markdown style (REQ-GEN-075)
        run: npm run lint:md

  commits:
    name: commitlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The range under review, never all of history. `bf91096` ("Initial
      # commit") predates the config and does not satisfy it; rewriting main to
      # fix that would invalidate every commit hash quoted in an ADR, so the
      # range is bounded instead. See OQ-016.
      - name: Conventional commits (REQ-BLD-031)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE:-}" ]; then
            from="$BASE"; to="$HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            from="$BEFORE"; to="${{ github.sha }}"
          else
            # A first push, a force-push, or a manual dispatch: no range exists,
            # so lint the tip commit rather than silently checking nothing.
            from="HEAD~1"; to="HEAD"
          fi
          echo "Linting $from..$to"
          npx --no-install commitlint --from "$from" --to "$to" --verbose

  # Actions are dependencies that run with the job's token, so §25.2's pinning
  # policy has to cover them. Its own job rather than a step in `docs` because it
  # is supply chain, not documentation, and because a red pin should not be
  # reported as a documentation failure.
  #
  # It lives in this workflow for the OQ-030 reason above: repo-lint.yml has no
  # `paths` filter, and a change that adds an unpinned action to spec-ci.yml
  # touches no path desktop-ci.yml watches.
  action-pins:
    name: action pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The gate's own corpus first, for the reason the docs job gives: this one
      # implements a line parser and eight rejection rules, and a parser that
      # matched nothing would report every workflow as clean.
      - name: Gate self-test
        run: python3 tools/check-action-pins.py --self-test

      - name: Actions are SHA-pinned (REQ-SEC-013, REQ-BLD-021)
        run: python3 tools/check-action-pins.py

  # The §27 documentation gates. Held back until they were green — a gate
  # introduced red is a gate somebody weakens instead of satisfies — and added
  # here in the commit that created the last missing [v1.0] §27 document,
  # docs/LGPL-SOURCE-OFFER.md. Recorded in OQ-030.
  #
  # Standard library only, so there is nothing to install and no lockfile to
  # trust: the interpreter is pinned for the same reason the Node tools are, not
  # because a dependency needs resolving.
  docs:
    name: documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Each gate's own corpus first. A linter whose rules are themselves
      # untested reports whatever its bugs allow, and all three of these
      # implement an algorithm they could get subtly wrong: GitHub's
      # heading-to-anchor slug, the REQ-GEN-020 ledger rules, and the purl and
      # CycloneDX shapes the SBOM has to be right about. Run before the gates so
      # a failure here is unambiguous — the checker is broken, not the
      # repository.
      - name: Gate self-tests
        run: |
          set -euo pipefail
          python3 tools/check-doc-links.py --self-test
          python3 tools/gen-third-party/gen-third-party.py --self-test
          python3 tools/gen-sbom.py --self-test

      # §27's two mechanical halves: every listed document exists, and every
      # internal link resolves. External URLs are deliberately not fetched — a
      # gate that needs the network fails for reasons unrelated to the change.
      - name: Documents exist and internal links resolve (REQ-GEN-075)
        run: python3 tools/check-doc-links.py

      # All three generated documents come off one register, so a hand-edit to any
      # of them — or a dependency added to vcpkg.json without a register entry —
      # shows up as a diff here. §25.5 step 8 requires exactly this staleness
      # check at release time; running it on every push is what keeps that step
      # from being the first place anyone notices.
      #
      # The SBOM is in this list because docs/LGPL-SOURCE-OFFER.md says it is.
      # That sentence is generated from the register too, and a generated
      # document asserting a check that no workflow runs is the OQ-042 failure
      # over again.
      - name: Generated documents are not stale (REQ-GEN-012, REQ-GEN-020, REQ-GEN-021)
        run: |
          set -euo pipefail
          python3 tools/gen-third-party/gen-third-party.py --check --document third-party
          python3 tools/gen-third-party/gen-third-party.py --check --document source-offer
          python3 tools/gen-sbom.py --check
