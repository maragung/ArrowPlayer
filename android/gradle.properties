# Arrow Player — Android build properties.
# The version the About screen shows and the APK reports comes from here, the
# single source within android/ (ADR 0012). Release CI overrides versionName
# from the git tag; this file stays in step with desktop/version.txt by the
# same-commit rule (REQ-LIB-001).

arrow.version=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
